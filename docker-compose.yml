name: driver-sync-sdd

services:
  postgres:
    image: postgres:16
    container_name: driver-sync-postgres
    environment:
      POSTGRES_USER: ultra
      POSTGRES_PASSWORD: ultra
      POSTGRES_DB: ultra_sync_test
    ports:
      - "55432:5432"
    command:
      # Log de instruções desligado por padrão; a suíte conta queries pela
      # instrumentação do adapter, não pelo log do servidor.
      - postgres
      - -c
      - max_connections=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ultra -d ultra_sync_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      # Banco de teste: durabilidade não interessa e memória é muito mais rápida.
      - /var/lib/postgresql/data

  kafka:
    image: apache/kafka:3.9.0
    container_name: driver-sync-kafka
    ports:
      - "59092:9092"
    environment:
      # KRaft single-node: sem Zookeeper. O nó acumula os papéis de broker e
      # controller, o que só é aceitável porque isto é ambiente de teste.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://127.0.0.1:59092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # Fator de replicação 1 em todo lugar — nó único. Em produção é 3, com
      # min.insync.replicas=2, como declarado em contracts/asyncapi.yaml.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # Compaction agressiva. O default do Kafka espera minutos antes de
      # compactar, o que tornaria o teste de bootstrap por snapshot lento e
      # dependente de espera — exatamente o tipo de teste que vira flaky.
      KAFKA_LOG_CLEANER_ENABLE: "true"
      KAFKA_LOG_CLEANER_MIN_CLEANABLE_RATIO: "0.01"
      KAFKA_LOG_CLEANER_BACKOFF_MS: "100"
      KAFKA_LOG_SEGMENT_BYTES: "1048576"
      KAFKA_LOG_ROLL_MS: "1000"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s
